name: macOS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number counts commits
      - name: Test accounting and transcript updates
        run: Scripts/test.sh
      - name: Build universal app
        run: Scripts/build.sh
      - name: Verify packaged binary
        run: dist/Tobken.app/Contents/MacOS/Tobken --verify
      - name: Render UI previews
        run: dist/Tobken.app/Contents/MacOS/Tobken --render-preview dist/preview
      - name: Package app
        run: ditto -c -k --keepParent dist/Tobken.app dist/Tobken.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tobken
          path: dist/Tobken.zip
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: dist/preview/*.png
          if-no-files-found: warn
